<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-eval' 'wasm-unsafe-eval';
             script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval';
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
             font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
             img-src 'self' data: blob:;" />
  <title>Compositor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
<div id="app">

  <!-- Left toolbar -->
  <div id="toolbar"></div>

  <!-- Tab strip -->
  <div id="tabs"></div>

  <!-- Tool options (inspector) bar -->
  <div id="inspector"></div>

  <!-- Canvas viewport -->
  <div id="canvas-area">
    <div id="canvas-bg">
      <canvas id="compositor-canvas" width="800" height="600"></canvas>
    </div>
    <div id="guides-overlay"></div>
    <div id="ruler-corner" title="Click to toggle Rulers (Ctrl+R)">px</div>
    <canvas id="ruler-h" height="20"></canvas>
    <canvas id="ruler-v" width="20"></canvas>
    <div id="canvas-empty">
      <div class="empty-title">No canvas open</div>
      <div class="empty-sub">New Canvas (Ctrl+N) or Open Project (Ctrl+O)</div>
    </div>
    <div id="zoom-label">100%</div>
    <div id="transform-hud" class="transform-hud"></div>
    <div id="canvas-scrollbar-h" class="canvas-scrollbar"><div class="canvas-scrollbar-thumb"></div></div>
    <div id="canvas-scrollbar-v" class="canvas-scrollbar"><div class="canvas-scrollbar-thumb"></div></div>
  </div>

  <!-- Layers panel -->
  <div id="layers-panel">
    <div id="layers-resizer" title="Drag to resize Layers panel"></div>
    <div id="layers-title-row">
      <span class="layers-title">Layers</span>
      <span id="layers-count" class="layers-count">0</span>
    </div>
    <div id="layers-header">
      <div id="blend-opacity-row">
        <select id="blend-mode-select"></select>
        <span id="opacity-label">Opacity</span>
        <input type="range" id="opacity-slider" min="0" max="100" value="100" step="1" />
        <input type="number" id="opacity-input" min="0" max="100" value="100" />
      </div>
      <div id="layers-actions">
        <button class="layers-action-btn" id="btn-new-layer" title="New Layer (Ctrl+Shift+N)">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button class="layers-action-btn" id="btn-new-group" title="New Group">
          <i class="fa-solid fa-folder-plus"></i>
        </button>
        <button class="layers-action-btn" id="btn-duplicate" title="Duplicate Layer (Ctrl+J)">
          <i class="fa-solid fa-clone"></i>
        </button>
        <button class="layers-action-btn danger" id="btn-delete-layer" title="Delete Layer (Del)">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </div>
    <div id="layers-list"></div>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <span id="status-zoom">100%</span>
    <span class="status-sep">·</span>
    <span id="status-dimensions">1920 × 1080 px</span>
    <span class="status-sep">·</span>
    <span id="status-profile">sRGB · Transparent</span>
    <span class="status-spacer"></span>
    <span id="status-hint"></span>
  </div>

</div>

<!-- Startup loader overlay -->
<div id="startup-loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Loading Compositor…</div>
</div>

<!-- Modal mount point -->
<div id="modal-root"></div>

<script type="module" src="app.js"></script>
</body>
</html>
